<style>
:root{--bg:#F5F7F7;--card:#fff;--ink:#0F2633;--ink2:#5A6A72;--line:#E1E6E7;--fill:#ECF0F1;--sea:#1C5A85;--bou:#C2185B;--bous:#FBE7F0;--ok:#2E7D4F;--warn:#A0640F;--bad:#B3261E;--disp:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;--tabh:62px}
@media (prefers-color-scheme:dark){:root{--bg:#0A1820;--card:#11232C;--ink:#E9F0F2;--ink2:#93A5AD;--line:#1F3641;--fill:#172E39;--sea:#79B6E2;--bou:#EE5E97;--bous:#3A1828;--ok:#6CC28F;--warn:#E3A84A;--bad:#F08A80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;color:inherit}
.vw{display:none;padding:calc(env(safe-area-inset-top) + 8px) 16px 32px;max-width:640px;margin:0 auto}
.vw.on{display:block}
h1{font:700 34px/1.05 var(--disp);letter-spacing:-.015em;margin:12px 0 6px}
h2{font:700 22px/1.15 var(--disp);margin:24px 0 10px}
h3{font-size:15px;font-weight:600;margin:20px 0 8px;display:flex;align-items:center;gap:6px}
.sub{color:var(--ink2);margin:0 0 18px}
.muted{color:var(--ink2)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.card.list{padding-top:0;padding-bottom:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--bou);border-color:var(--bou);color:#fff}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.w{width:100%}.btn.ghost{background:none;border-color:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.icb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:20px;flex:none;cursor:pointer;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{display:inline-block;padding:6px 10px;border-radius:8px;background:var(--fill);font-size:14px;margin:0 6px 6px 0;color:var(--ink);text-decoration:none}
a.tag{color:var(--sea)}
.sq{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.tp{display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:13px;font-weight:600;padding:4px 10px;border-radius:8px;white-space:nowrap}
.price{font:700 40px/1 var(--disp);letter-spacing:-.02em}
.it{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}.it:last-child{border-bottom:0}
.mt{background:var(--fill);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;font-size:13px;color:var(--ink2)}
.mt b{font:700 22px/1.2 var(--disp);color:var(--ink);margin:2px 0}
label.f{display:block;font-size:14px;color:var(--ink2);margin:14px 0 6px}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;padding:0 12px;-webkit-appearance:none;appearance:none}
textarea{padding:10px 12px;min-height:96px;line-height:1.4}
input[type=range]{min-height:32px;padding:0;border:0;background:none;accent-color:var(--bou);-webkit-appearance:auto;appearance:auto}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.av{width:44px;height:44px;border-radius:50%;background:var(--bous);color:var(--bou);display:grid;place-items:center;font-weight:700;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);background:color-mix(in srgb,currentColor 14%,transparent)}
.s-New{color:var(--sea)}.s-Active{color:var(--ok)}.s-Viewing{color:var(--warn)}.s-Offer{color:var(--bou)}.s-Closed{color:var(--ink2)}
.hero{background:var(--bou);border-color:var(--bou);color:#fff}
.hero .muted{color:rgba(255,255,255,.85)}
.hero .btn{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:88px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;font-size:15px;font-weight:600;cursor:pointer;gap:8px}
.tile i{font-size:24px;color:var(--bou)}
.pitch{background:var(--bous);border-color:transparent}
.tip{background:var(--fill);background:color-mix(in srgb,var(--warn) 13%,var(--card));border-color:transparent;display:flex;gap:10px}
.tip i{color:var(--warn);font-size:20px}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:4px}
.fc{min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;font-size:19px;font-weight:600;cursor:pointer}
details{border-bottom:1px solid var(--line);padding:14px 0}details:last-child{border-bottom:0}summary{font-weight:600;cursor:pointer}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:1500;display:flex;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

#v-map{position:relative;padding:0;max-width:none}

.mapui{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;z-index:1000;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.mapui>*{pointer-events:auto}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:0 2px 12px rgba(0,0,0,.14)}

.seg button.on{background:var(--ink);color:var(--bg)}
.fab{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--sea);display:grid;place-items:center;font-size:23px;box-shadow:0 2px 12px rgba(0,0,0,.16);cursor:pointer}
.legend{position:absolute;left:12px;bottom:24px;z-index:1000;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;display:grid;gap:4px;box-shadow:0 2px 12px rgba(0,0,0,.14)}
.legend div{display:flex;align-items:center;gap:6px}
.mk{background:none;border:0}
.mk>div{transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:max-content}
.mk span{color:#fff;font:700 13px/1 var(--disp);padding:6px 8px;border-radius:10px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.mk b{display:none;font-size:11px;font-weight:600;background:var(--card);color:var(--ink);padding:3px 6px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#map.names .mk b{display:block}
#map.dots .mk:not(.agg) span{font-size:0;padding:0;width:18px;height:18px;border-radius:50%}
.leaflet-container{font:inherit}
.sh{position:fixed;inset:0;z-index:2000;display:none}.sh.on{display:block}
.shb{position:absolute;inset:0;background:rgba(4,14,20,.5)}
.shp{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:22px 22px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(48px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.shp{animation:none}}
.shtop{position:sticky;top:0;display:flex;justify-content:center;align-items:center;height:48px;background:var(--bg);z-index:2;margin:0 -16px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line)}
.shx{position:absolute;right:12px;top:6px;width:36px;height:36px;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.empty{text-align:center;padding:28px 16px}.empty>i{font-size:34px;color:var(--bou)}

function match(c){const B=+c.budget||0,S=+c.size||0,imp=B&&S?B/S:0;return Z.map(z=>{const m=(c.want||[]).filter(k=>has(z,k)).length,pref=(c.zones||[]).includes(z.id);let st=-1,sc=m*12+(pref?15:0);if(B&&S){const cost=z.p*S;st=cost<=B?0:cost<=B*1.15?1:2;sc+=(st===0?30:st===1?12:-25)+Math.max(0,1-Math.abs(z.p-imp)/imp)*20}return{z,m,st,sc}}).sort((a,b)=>b.sc-a.sc)}
function has(z,k){return k==="a"?z.air<=35:k==="gr"?z.y>=7:k==="v"?z.p<4300:z.tg.split(" ").includes(k)}
